name: Blablabla

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages -r requirements.txt
          python3 -m pip install --break-system-packages pytest

      - name: Run tests
        run: python3 -m pytest

  deploy:
    needs: test
    runs-on: self-hosted

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~
            cd try-deployment
            git pull

            docker build -t try-deployment .

            docker stop try-deployment || true
            docker rm try-deployment || true

            docker run -d -p 80:5000 --name try-deployment try-deployment
